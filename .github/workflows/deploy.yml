name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - Despliegue_Test

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-ecommerce/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app-ecommerce
        run: pnpm install --frozen-lockfile

      - name: Check Algolia configuration
        working-directory: app-ecommerce
        env:
          VITE_ALGOLIA_APP_ID: ${{ vars.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY: ${{ vars.VITE_ALGOLIA_SEARCH_KEY }}
          VITE_ALGOLIA_INDEX_MAIN: ${{ vars.VITE_ALGOLIA_INDEX_MAIN }}
          VITE_ALGOLIA_INDEX_PRICE_ASC: ${{ vars.VITE_ALGOLIA_INDEX_PRICE_ASC }}
          VITE_ALGOLIA_INDEX_PRICE_DESC: ${{ vars.VITE_ALGOLIA_INDEX_PRICE_DESC }}
        run: pnpm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-ecommerce/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4